# Neovim (.config/nvim/after/lsp/) と同じ language server 構成に寄せる。
# helix の既定 (languages.toml) で定義済みのサーバーは name を参照するだけでよく、
# 未定義のものだけここで [language-server.*] を足している。
#
# 既定との主な差分:
#   - TypeScript 系は typescript-language-server ではなく vtsls (PATH にあるのは vtsls だけ)
#   - nix は nil を外して nixd のみ、toml は tombi を外して taplo のみ
#   - tailwindcss / unocss / cssmodules を Web 系の言語に追加

[language-server.cssmodules]
command = "cssmodules-language-server"

[language-server.unocss]
command = "unocss-language-server"
args = ["--stdio"]

# biome / eslint はプロジェクトに設定ファイルがあるときだけ起動させる
# (Neovim 側は root_markers / root_dir で同じ制御をしている)。
[language-server.biome-lsp-proxy]
required-root-patterns = ["biome.json", "biome.jsonc", ".biome.json", ".biome.jsonc"]

[language-server.vscode-eslint-language-server]
required-root-patterns = [".eslintrc*", "eslint.config.*"]

# nixd の設定は after/lsp/nixd.lua から移植。flake の nixpkgs と
# home-manager のオプションを補完候補に出すための expr。
[language-server.nixd.config.nixd.nixpkgs]
expr = 'import (builtins.getFlake ("git+file://" + toString ./.)).inputs.nixpkgs {}'

[language-server.nixd.config.nixd.options.home-manager]
expr = '(let sudoUser = builtins.getEnv "SUDO_USER"; username = builtins.getEnv "USER"; user = if sudoUser != "" then sudoUser else if username == "" || username == "root" then "user" else username; in (builtins.getFlake ("git+file://" + toString ./.)).homeConfigurations.${user}.options)'

[language-server.nixd.config.nixd.formatting]
command = ["alejandra"]

# code-actions-on-save は保存時に LSP の code action を順に実行する。
# 提供していないサーバーがいる場合はその action だけスキップされるので、
# ESLint が無いプロジェクトでも source.fixAll.eslint は無害。
[[language]]
name = "typescript"
code-actions-on-save = ["source.addMissingImports.ts", "source.fixAll.eslint"]
language-servers = [
  "vtsls",
  "vscode-eslint-language-server",
  "biome-lsp-proxy",
  "cssmodules",
  "tailwindcss-ls",
  "unocss",
]

[[language]]
name = "tsx"
code-actions-on-save = ["source.addMissingImports.ts", "source.fixAll.eslint"]
language-servers = [
  "vtsls",
  "vscode-eslint-language-server",
  "biome-lsp-proxy",
  "cssmodules",
  "tailwindcss-ls",
  "unocss",
]

[[language]]
name = "javascript"
code-actions-on-save = ["source.addMissingImports.ts", "source.fixAll.eslint"]
language-servers = [
  "vtsls",
  "vscode-eslint-language-server",
  "biome-lsp-proxy",
  "cssmodules",
  "tailwindcss-ls",
  "unocss",
]

[[language]]
name = "jsx"
code-actions-on-save = ["source.addMissingImports.ts", "source.fixAll.eslint"]
language-servers = [
  "vtsls",
  "vscode-eslint-language-server",
  "biome-lsp-proxy",
  "cssmodules",
  "tailwindcss-ls",
  "unocss",
]

[[language]]
name = "svelte"
language-servers = [
  "svelteserver",
  "vscode-eslint-language-server",
  "biome-lsp-proxy",
  "tailwindcss-ls",
  "unocss",
]

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-ls", "unocss"]

[[language]]
name = "scss"
language-servers = ["vscode-css-language-server", "tailwindcss-ls", "unocss"]

[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "tailwindcss-ls", "unocss"]

[[language]]
name = "json"
language-servers = ["vscode-json-language-server", "biome-lsp-proxy"]

[[language]]
name = "jsonc"
language-servers = ["vscode-json-language-server", "biome-lsp-proxy"]

# 既定は nil と nixd の両方が起動する。Neovim は nixd のみ。
[[language]]
name = "nix"
language-servers = ["nixd"]

# 既定は taplo と tombi。tombi は入れていないので taplo だけにする。
[[language]]
name = "toml"
language-servers = ["taplo"]

# 既定は marksman が先頭だが、入れているのは markdown-oxide のみ。
[[language]]
name = "markdown"
language-servers = ["markdown-oxide"]

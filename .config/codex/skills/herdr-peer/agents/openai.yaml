  short_description: "Review edits and recheck authorized fixes with a peer"
  default_prompt: "Use $herdr-peer to request a read-only review of current-task edits, including known non-sensitive gitignored edits, and re-review authorized blocker/major fixes within one initial review plus at most two follow-ups; report minor/nit and unresolved findings."

name: Check

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (defaults to event ref)'
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

concurrency:
  group: check-${{ inputs.ref || github.ref }}
  # main の build job だけが Cachix に push するので、main では前の run を潰さない
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    # NOTE: name は main の ruleset が required status check の context
    # (`Check / Format check`) として参照しているため変更しない。実際の中身は
    # フォーマット確認だけでなく lint / typos まで含む (`just check-static`)。
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # `just gitleaks-scan` が全履歴を走査する
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
      - name: Run all static checks
        # Backstop for the lefthook pre-commit/pre-push gate, which can be bypassed
        # with --no-verify, and for errors that otherwise surface only when the hooks
        # run at session runtime. Runs the justfile recipe inside the devShell, so the
        # justfile stays the single source of truth for *what* is checked and the
        # flake for *which tool versions* do the checking.
        # nix-eval は含めない (build job の `nix flake check` が同じ評価をするため)。
        run: nix develop --command just check-static

  hash-patterns:
    # NOTE: 中身は lint job の `just check-static` にも含まれる。main の ruleset が
    # `Check / Hash update patterns` を required status check として参照しているため
    # job 名を残している。ruleset から外したらこの job ごと削除できる。
    name: Hash update patterns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
      - name: Verify hash-update and Renovate patterns match overlay files
        run: nix develop --command just hash-patterns-test renovate-patterns-test

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Audit npm lockfiles
        run: |
          failed=0
          for dir in nix/npm-locks/*/; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "::group::Auditing $dir"
              (cd "$dir" && npm audit --audit-level=high) || failed=1
              echo "::endgroup::"
            fi
          done
          exit $failed

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check flake
        run: nix flake check --fallback

  build-darwin:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check flake
        run: nix flake check --fallback
      - name: Run tests
        # fmt / lint は OS に依存しないので lint job に任せ、ここではテストだけを実行する
        run: nix develop --command just test

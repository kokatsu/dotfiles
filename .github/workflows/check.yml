name: Check

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout (defaults to event ref)"
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

concurrency:
  group: check-${{ inputs.ref || github.ref }}
  # main の build job だけが Cachix に push するので、main では前の run を潰さない
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    # NOTE: name は main の ruleset が required status check の context
    # (`Check / Format check`) として参照しているため変更しない。実際の中身は
    # フォーマット確認だけでなく lint / typos まで含む (`just check-static`)。
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # `just gitleaks-scan` が全履歴を走査する
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
      - name: Run all static checks
        env:
          AI_WRITING_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        # Backstop for the lefthook pre-commit/pre-push gate, which can be bypassed
        # with --no-verify, and for errors that otherwise surface only when the hooks
        # run at session runtime. Runs the justfile recipe inside the devShell, so the
        # justfile stays the single source of truth for *what* is checked and the
        # flake for *which tool versions* do the checking.
        # nix-eval は含めない (build job の `nix flake check` が同じ評価をするため)。
        run: nix develop --command just check-static

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Audit npm lockfiles
        # GHSA-fc5q-39xc-vjpf には修正版がないため、範囲が変わらず picomatch の latest が
        # 4.0.7 のままの間だけ除外する。どちらかが変わったら失敗させて除外を見直す
        env:
          IGNORE_URL: https://github.com/advisories/GHSA-fc5q-39xc-vjpf
          IGNORE_RANGE: "<=4.0.7"
          IGNORE_UNTIL_LATEST: 4.0.7
        run: |
          latest=$(npm view picomatch version)
          if [ "$latest" != "$IGNORE_UNTIL_LATEST" ]; then
            echo "::error::picomatch $latest is released; re-check $IGNORE_URL and drop the exclusion"
            exit 1
          fi
          failed=0
          for dir in nix/npm-locks/*/; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "::group::Auditing $dir"
              # 脆弱性があっても非ゼロで終わるため、終了コードではなく JSON で判定する
              report=$(cd "$dir" && npm audit --json) || true
              if ! jq -e '(.vulnerabilities | type == "object") and (has("error") | not)' <<<"$report" >/dev/null; then
                echo "$report"
                echo "::error::npm audit did not return a report for $dir"
                failed=1
              else
                remaining=$(jq -r --arg url "$IGNORE_URL" --arg range "$IGNORE_RANGE" '
                  [.vulnerabilities[].via[] | objects
                    | select(.severity == "high" or .severity == "critical")
                    | select((.url == $url and .range == $range) | not)]
                  | unique_by(.url)[] | "\(.severity) \(.name)@\(.range) \(.title) \(.url)"' <<<"$report")
                if [ -n "$remaining" ]; then
                  echo "$remaining"
                  failed=1
                fi
              fi
              echo "::endgroup::"
            fi
          done
          exit $failed

  build-linux:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build (Linux)
            runner: ubuntu-latest
          - name: Build (Linux ARM)
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check flake
        run: nix flake check --fallback
      - name: Run ARM tests
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: nix develop --command just test

  build-darwin:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check flake
        run: nix flake check --fallback
      - name: Run tests
        # fmt / lint は OS に依存しないので lint job に任せ、ここではテストだけを実行する
        run: nix develop --command just test

name: Check

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (defaults to event ref)'
        required: false
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

concurrency:
  group: check-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # NOTE: name は main の ruleset が required status check の context
    # (`Check / Format check`) として参照しているため変更しない。実際の中身は
    # フォーマット確認だけでなく lint / typos まで含む (`just check-static`)。
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
      - name: Run all static checks
        # Backstop for the lefthook pre-commit/pre-push gate, which can be bypassed
        # with --no-verify, and for errors that otherwise surface only when the hooks
        # run at session runtime. Runs the justfile recipe inside the devShell, so the
        # justfile stays the single source of truth for *what* is checked and the
        # flake for *which tool versions* do the checking.
        # nix-eval は含めない (build job の `nix flake check` が同じ評価をするため)。
        run: nix develop --command just check-static

  hash-patterns:
    name: Hash update patterns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify sed patterns match overlay file
        run: bash scripts/test-hash-patterns.sh
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Verify Renovate regex patterns match overlay files
        run: deno run --allow-read scripts/test-renovate-patterns.ts

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    # 通常は数秒で終わるが、registry の advisories/bulk endpoint は応答に
    # 数分かかることがある (下の fetch-timeout 10 分 + 起動分を見込む)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Audit npm lockfiles
        # bulk endpoint の応答が npm 既定の fetch-timeout (5 分) を超えると、
        # 廃止済みの audits/quick endpoint に fallback して 400 で失敗する。
        # timeout を伸ばして bulk の応答を待ち、lockfile ごとに並列で走らせて
        # 遅延が直列に積み上がらないようにする。
        run: |
          pids=()
          dirs=()
          for dir in nix/npm-locks/*/; do
            if [ -f "$dir/package-lock.json" ]; then
              (cd "$dir" && npm audit --audit-level=high --fetch-timeout=600000) \
                >"$RUNNER_TEMP/$(basename "$dir").log" 2>&1 &
              pids+=("$!")
              dirs+=("$dir")
            fi
          done
          failed=0
          for i in "${!pids[@]}"; do
            echo "::group::Auditing ${dirs[$i]}"
            wait "${pids[$i]}" || failed=1
            cat "$RUNNER_TEMP/$(basename "${dirs[$i]}").log"
            echo "::endgroup::"
          done
          exit $failed

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check flake
        run: nix flake check --fallback
      - name: Test Neovim custom plugins
        run: nix develop --command nvim --headless --clean -l scripts/test-nvim-config.lua

  build-darwin:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kokatsu
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Check flake
        run: nix flake check --fallback

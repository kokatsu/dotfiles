[default]
extend-ignore-re = [
  "sha256-.+",           # Nix SRI hashes
  'U\+[0-9A-Fa-f]{4,6}', # Unicode コードポイント (U+E0BA)
  '\\x\{[0-9A-Fa-f]+\}', # Perl の文字エスケープ (\x{E0BA})
]

[default.extend-words]
noice = "noice"     # noice.nvim (Neovim プラグイン名)
ratatui = "ratatui" # ratatui / ratatui-image (Rust TUI クレート名)

[files]
ignore-hidden = false
extend-exclude = [".git/", "*.png", "*.webp"]
